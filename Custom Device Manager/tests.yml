name: custom-device-manager

on:
  push:
    branches: [main]
    paths:
      - "Custom Device Manager/**"
      - ".github/workflows/custom-device-manager-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "Custom Device Manager/**"
      - ".github/workflows/custom-device-manager-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        working-directory: "Custom Device Manager"
        run: pytest -v
