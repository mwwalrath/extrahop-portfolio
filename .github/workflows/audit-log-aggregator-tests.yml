name: audit-log-aggregator

on:
  push:
    branches: [main]
    paths:
      - "revealx-360-audit-log-source-aggregator/**"
      - ".github/workflows/audit-log-aggregator-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "revealx-360-audit-log-source-aggregator/**"
      - ".github/workflows/audit-log-aggregator-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "revealx-360-audit-log-source-aggregator/requirements-dev.txt"

      - name: Install dependencies
        working-directory: "revealx-360-audit-log-source-aggregator"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: "revealx-360-audit-log-source-aggregator"
        run: pytest -v
